name: Deploy to lighttools.com.au

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          WEBROOT: /var/www/lighttools
        run: |
          set -euo pipefail

          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@$SERVER_IP"

          # Ship the payload as a single tar stream rather than scp. The runner
          # ships OpenSSH 9.x, whose scp uses the SFTP backend, and that is
          # unreliable for multi-file transfers against this server's OpenSSH
          # 8.2 - it consistently failed on the last file of the batch.
          #
          # Staging goes to the home dir because the webroot is owned by
          # www-data, so writing into it directly as ubuntu is denied.
          tar czf - *.html sitemap.xml ads.txt \
            | $SSH "rm -rf ~/deploy-staging \
                    && mkdir -p ~/deploy-staging \
                    && tar xzf - -C ~/deploy-staging"

          # Move into place, then reset ownership and permissions.
          # Directories stay 755, files 644.
          $SSH "sudo cp -r ~/deploy-staging/. $WEBROOT/ && \
                sudo chown www-data:www-data $WEBROOT/* && \
                sudo chmod 755 $WEBROOT && \
                sudo chmod 644 $WEBROOT/*.html $WEBROOT/*.xml $WEBROOT/*.txt && \
                rm -rf ~/deploy-staging && \
                echo 'lighttools deploy complete'"

          rm /tmp/deploy_key
