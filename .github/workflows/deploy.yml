name: Deploy to lighttools.com.au

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SCP
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          WEBROOT: /var/www/lighttools
        run: |
          echo "$DEPLOY_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@$SERVER_IP"

          # Stage into a directory the ssh user owns. The webroot is owned by
          # www-data, so scp'ing straight into it fails with permission denied.
          $SSH "rm -rf ~/deploy-staging && mkdir -p ~/deploy-staging"

          scp -i /tmp/deploy_key \
              -o StrictHostKeyChecking=no \
              *.html sitemap.xml ads.txt \
              ubuntu@$SERVER_IP:~/deploy-staging/

          # Move into place, then reset ownership and permissions.
          # Directories must stay 755; files 644.
          $SSH "sudo cp ~/deploy-staging/. $WEBROOT/ -r && \
                sudo chown www-data:www-data $WEBROOT/* && \
                sudo chmod 755 $WEBROOT && \
                sudo chmod 644 $WEBROOT/*.html $WEBROOT/*.xml $WEBROOT/*.txt && \
                rm -rf ~/deploy-staging && \
                echo 'lighttools deploy complete'"

          rm /tmp/deploy_key
