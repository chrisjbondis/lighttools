<svg viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Three diagrams: wide vs narrow mirror lighting layouts, diffuse vs clear glass shadow comparison, and the bounce/incidence technique for high mirrors under low ceilings</title>
<desc>Illustrates bathroom face-lighting concepts: how mirror width determines fitting placement, why diffuser material affects shadowing, and how angled downlights bounce light off a mirror to reach the face</desc>
<defs>
  <style>
    .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #1a1a1a; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #6b6b6b; }
    .panel-title { font-size: 15px; font-weight: 700; }
    .cap { font-size: 11.5px; }
    .mirror { fill: #dbeafe; stroke: #94a3b8; stroke-width: 2; }
    .wall { fill: #f1f5f9; }
    .face { fill: #f0c9a0; stroke: #c9955f; stroke-width: 1.5; }
    .lit { fill: #fde68a; }
    .shadow { fill: rgba(0,0,0,0.28); }
    .ray { stroke: #f59e0b; stroke-width: 2; opacity: 0.75; }
    .ray-dim { stroke: #f59e0b; stroke-width: 1.2; opacity: 0.3; stroke-dasharray: 3 3; }
    .fitting { fill: #fbbf24; stroke: #b45309; stroke-width: 1.5; }
    .fitting-off { fill: #cbd5e1; stroke: #64748b; stroke-width: 1.5; }
  </style>
</defs>

<rect x="0" y="0" width="900" height="640" fill="#ffffff"/>

<!-- PANEL 1: wide vs narrow mirror -->
<text x="20" y="28" class="lbl panel-title">1. Mirror width decides fitting placement</text>

<!-- Narrow mirror, flanking sconces -->
<text x="20" y="52" class="sub cap">Narrow mirror (~1000mm) — flanking sconces overlap in the middle</text>
<rect x="20" y="62" width="260" height="150" class="wall"/>
<rect x="90" y="80" width="120" height="115" class="mirror"/>
<circle cx="150" cy="160" r="26" class="face"/>
<circle cx="80" cy="140" r="7" class="fitting"/>
<circle cx="220" cy="140" r="7" class="fitting"/>
<line x1="80" y1="140" x2="150" y2="160" class="ray"/>
<line x1="220" y1="140" x2="150" y2="160" class="ray"/>
<ellipse cx="150" cy="158" rx="20" ry="24" class="lit" opacity="0.5"/>

<!-- Wide mirror, side-only fails -->
<text x="320" y="52" class="sub cap">Wide mirror (~1500mm+) — side-only sconces leave a dark centre</text>
<rect x="320" y="62" width="260" height="150" class="wall"/>
<rect x="345" y="80" width="210" height="115" class="mirror"/>
<circle cx="450" cy="160" r="26" class="face"/>
<circle cx="360" cy="140" r="7" class="fitting"/>
<circle cx="540" cy="140" r="7" class="fitting"/>
<line x1="360" y1="140" x2="440" y2="155" class="ray-dim"/>
<line x1="540" y1="140" x2="460" y2="155" class="ray-dim"/>
<path d="M 438 138 a 20 24 0 0 1 24 0 z" class="shadow"/>
<text x="450" y="228" text-anchor="middle" class="sub cap">centre of face under-lit</text>

<!-- Wide mirror, fixed with centre/top light -->
<text x="620" y="52" class="sub cap">Wide mirror, fixed — add a central top or spanning source</text>
<rect x="620" y="62" width="260" height="150" class="wall"/>
<rect x="645" y="80" width="210" height="115" class="mirror"/>
<circle cx="750" cy="160" r="26" class="face"/>
<circle cx="660" cy="140" r="7" class="fitting-off"/>
<circle cx="840" cy="140" r="7" class="fitting-off"/>
<circle cx="750" cy="72" r="7" class="fitting"/>
<line x1="750" y1="72" x2="750" y2="160" class="ray"/>
<line x1="750" y1="72" x2="725" y2="150" class="ray"/>
<line x1="750" y1="72" x2="775" y2="150" class="ray"/>
<ellipse cx="750" cy="158" rx="22" ry="25" class="lit" opacity="0.5"/>

<line x1="0" y1="245" x2="900" y2="245" stroke="#e2e2e2" stroke-width="1"/>

<!-- PANEL 2: diffuse vs clear glass -->
<text x="20" y="278" class="lbl panel-title">2. Diffuser material determines whether you get shadows</text>

<text x="20" y="302" class="sub cap">Clear glass / exposed globe — point source, hard shadows</text>
<rect x="20" y="312" width="260" height="130" class="wall"/>
<circle cx="90" cy="360" r="6" fill="#fff7cc" stroke="#b45309" stroke-width="1.5"/>
<circle cx="210" cy="360" r="6" fill="#fff7cc" stroke="#b45309" stroke-width="1.5"/>
<circle cx="150" cy="390" r="24" class="face"/>
<path d="M 132 378 a 18 14 0 0 1 8 -4 z" class="shadow"/>
<path d="M 168 378 a 18 14 0 0 0 -8 -4 z" class="shadow"/>
<path d="M 150 400 a 10 8 0 0 1 0 10 z" class="shadow"/>
<text x="150" y="452" text-anchor="middle" class="sub cap">hard-edged shadows under brow, beside nose</text>

<text x="320" y="302" class="sub cap">White/opal glass — diffuse source, shadows fill in</text>
<rect x="320" y="312" width="260" height="130" class="wall"/>
<rect x="365" y="352" width="20" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<rect x="515" y="352" width="20" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<circle cx="450" cy="390" r="24" class="face"/>
<ellipse cx="450" cy="390" rx="26" ry="26" fill="#fde68a" opacity="0.35"/>
<text x="450" y="452" text-anchor="middle" class="sub cap">even, soft-graduated fill across the face</text>

<text x="620" y="302" class="sub cap">Fitting selection rule</text>
<rect x="620" y="312" width="260" height="130" rx="8" fill="#f7f7f5" stroke="#e2e2e2"/>
<text x="640" y="340" class="lbl cap" font-weight="600">Bright enough</text>
<text x="640" y="358" class="sub cap">+ opal/white diffuser</text>
<text x="640" y="382" class="lbl cap" font-weight="600">= even face light</text>
<text x="640" y="410" class="sub cap">Clear/ribbed glass or an</text>
<text x="640" y="426" class="sub cap">exposed globe stays a point</text>
<text x="640" y="440" class="sub cap">source, however bright.</text>

<line x1="0" y1="475" x2="900" y2="475" stroke="#e2e2e2" stroke-width="1"/>

<!-- PANEL 3: bounce technique -->
<text x="20" y="508" class="lbl panel-title">3. High mirror, low ceiling — the bounce technique</text>
<text x="20" y="530" class="sub cap">Straight-down light misses a face leaning in close; an angled fitting set back bounces light off the mirror instead</text>

<rect x="60" y="548" width="780" height="80" class="wall"/>
<!-- ceiling line -->
<line x1="60" y1="548" x2="840" y2="548" stroke="#94a3b8" stroke-width="2"/>
<text x="70" y="544" class="sub cap">ceiling ~2400mm</text>

<!-- mirror cabinet -->
<rect x="330" y="556" width="180" height="72" class="mirror"/>
<text x="420" y="600" text-anchor="middle" class="sub cap" fill="#1e3a5f">mirror / cabinet</text>

<!-- straight down fitting - fails -->
<circle cx="420" cy="556" r="6" class="fitting-off"/>
<line x1="420" y1="556" x2="420" y2="600" class="ray-dim"/>
<text x="420" y="640" text-anchor="middle" class="sub cap">straight down: light stops at mirror top, misses face up close</text>

<!-- gimballed fitting set back, angled -->
<circle cx="230" cy="556" r="7" class="fitting"/>
<line x1="230" y1="556" x2="420" y2="580" class="ray"/>
<line x1="420" y1="580" x2="290" y2="628" class="ray"/>
<circle cx="290" cy="628" r="20" class="face"/>
<text x="230" y="640" text-anchor="middle" class="sub cap">oyster / gimbal, set back and angled: bounces off mirror onto face</text>

</svg>
